name: Ghosium Browser One-Shot Brand Migration

on:
  push:
    branches:
      - fix/v0.5.1-data-release-integrity

permissions:
  contents: write

jobs:
  migrate-brand:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: fix/v0.5.1-data-release-integrity
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run audited Ghosium migration
        shell: pwsh
        run: ./.github/scripts/ghosium-migrate.ps1
