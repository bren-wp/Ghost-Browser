name: Ghosium Browser One-Shot Brand Migration

on:
  push:
    branches:
      - fix/v0.5.1-data-release-integrity

permissions:
  contents: write

jobs:
  migrate-brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          ref: fix/v0.5.1-data-release-integrity
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Migrate product identity and lock dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $legacyLower = 'gh' + 'ost'
          $legacyTitle = 'Gh' + 'ost'
          $legacyUpper = 'GH' + 'OST'

          $textFiles = @(git grep -Il -i -- $legacyLower -- . 2>$null)
          if ($LASTEXITCODE -notin @(0, 1)) {
            throw 'Unable to enumerate legacy branding in tracked text files.'
          }

          foreach ($file in $textFiles) {
            $path = Join-Path $PWD $file
            $text = [System.IO.File]::ReadAllText($path)
            $text = $text.Replace("$legacyTitle Browser", 'Ghosium Browser')
            $text = $text.Replace("$legacyUpper BROWSER", 'GHOSIUM BROWSER')
            $text = $text.Replace("$legacyLower-browser", 'ghosium-browser')
            $text = $text.Replace("${legacyLower}_browser", 'ghosium_browser')
            $text = $text.Replace("${legacyTitle}Browser", 'GhosiumBrowser')
            $text = $text.Replace("${legacyLower}browser", 'ghosiumbrowser')
            $text = $text.Replace("${legacyLower}://", 'ghosium://')
            $text = $text.Replace($legacyTitle, 'Ghosium')
            $text = $text.Replace($legacyUpper, 'GHOSIUM')
            $text = $text.Replace($legacyLower, 'ghosium')
            [System.IO.File]::WriteAllText(
              $path,
              $text,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          $legacyPaths = @(git ls-files | Where-Object { $_ -match "(?i)$legacyLower" })
          foreach ($oldPath in $legacyPaths) {
            $newPath = $oldPath -replace "(?i)$legacyLower", 'ghosium'
            if ($newPath -ne $oldPath) {
              $newParent = Split-Path -Parent $newPath
              if ($newParent) { New-Item -ItemType Directory -Force -Path $newParent | Out-Null }
              git mv -- $oldPath $newPath
              if ($LASTEXITCODE -ne 0) { throw "Unable to rename $oldPath" }
            }
          }

          npm install --package-lock-only --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'npm lockfile generation failed.' }

          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Cargo lockfile generation failed.' }

          $workflowPath = '.github/workflows/windows-build.yml'
          $workflow = [System.IO.File]::ReadAllText($workflowPath)
          $workflow = $workflow.Replace('run: npm install', 'run: npm ci')
          $workflow = $workflow.Replace(
            'cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc',
            'cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --locked'
          )
          $workflow = $workflow.Replace(
            'cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --lib',
            'cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --lib --locked'
          )

          $brandGate = @'

              - name: Enforce Ghosium-only branding
                shell: pwsh
                run: |
                  $ErrorActionPreference = "Stop"
                  $legacy = "gh" + "ost"
                  $badPaths = @(git ls-files | Where-Object { $_ -match "(?i)$legacy" })
                  if ($badPaths.Count -gt 0) {
                    throw "Legacy product branding remains in tracked paths: $($badPaths -join ', ')"
                  }
                  $matches = @(git grep -I -n -i -- $legacy -- . 2>$null)
                  if ($LASTEXITCODE -eq 0) {
                    throw "Legacy product branding remains in tracked text:`n$($matches -join "`n")"
                  }
                  if ($LASTEXITCODE -ne 1) {
                    throw "Branding scan failed with exit code $LASTEXITCODE"
                  }
'@
          $anchor = '      - name: Install frontend dependencies'
          if (!$workflow.Contains('Enforce Ghosium-only branding')) {
            $workflow = $workflow.Replace($anchor, $brandGate + "`n" + $anchor)
          }
          [System.IO.File]::WriteAllText(
            $workflowPath,
            $workflow,
            [System.Text.UTF8Encoding]::new($false)
          )

          git rm -- .github/workflows/ghosium-brand-migration.yml
          if ($LASTEXITCODE -ne 0) { throw 'Unable to remove one-shot migration workflow.' }

          $badPathsAfter = @(git ls-files | Where-Object { $_ -match "(?i)$legacyLower" })
          if ($badPathsAfter.Count -gt 0) {
            throw "Legacy branding remains in tracked paths: $($badPathsAfter -join ', ')"
          }
          $matchesAfter = @(git grep -I -n -i -- $legacyLower -- . 2>$null)
          if ($LASTEXITCODE -eq 0) {
            throw "Legacy branding remains in tracked text:`n$($matchesAfter -join "`n")"
          }
          if ($LASTEXITCODE -ne 1) {
            throw "Final branding scan failed with exit code $LASTEXITCODE"
          }

          git config user.name 'Brendigo'
          git config user.email 'info@brendigo.com'
          git add -A
          git status --short
          git commit -m 'Complete Ghosium Browser rebrand and lock dependencies'
          if ($LASTEXITCODE -ne 0) { throw 'Migration commit failed.' }
          git push origin HEAD:fix/v0.5.1-data-release-integrity
          if ($LASTEXITCODE -ne 0) { throw 'Migration push failed.' }
