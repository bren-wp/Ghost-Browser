name: Ghosium Browser One-Shot Rustfmt

on:
  push:
    branches:
      - fix/v0.5.1-data-release-integrity

permissions:
  contents: write

jobs:
  format-rust:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout stabilization branch
        uses: actions/checkout@v5
        with:
          ref: fix/v0.5.1-data-release-integrity
          fetch-depth: 0

      - name: Setup Rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format committed Rust sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo fmt --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "rustfmt failed" }
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw "rustfmt verification failed" }

          $changes = @(git status --short)
          if ($changes.Count -eq 0) {
            Write-Host "Rust sources are already formatted."
            exit 0
          }

          $unexpected = @($changes | Where-Object { $_ -notmatch '^ M src-tauri/(src/.*\.rs|build\.rs)$' })
          if ($unexpected.Count -gt 0) {
            throw "rustfmt changed unexpected paths:`n$($unexpected -join "`n")"
          }

          git config user.name "Brendigo"
          git config user.email "info@brendigo.com"
          git add src-tauri/src/*.rs src-tauri/build.rs
          git commit -m "Apply committed Rust formatting"
          if ($LASTEXITCODE -ne 0) { throw "rustfmt commit failed" }
          git push origin HEAD:fix/v0.5.1-data-release-integrity
          if ($LASTEXITCODE -ne 0) { throw "rustfmt push failed" }
