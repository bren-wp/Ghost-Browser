name: Ghosium Browser One-Shot UI Redesign

on:
  push:
    branches:
      - feat/ghosium-browser-v0.6-native-chromium

permissions:
  contents: write

jobs:
  redesign-ui:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout Ghosium native branch
        uses: actions/checkout@v5
        with:
          ref: feat/ghosium-browser-v0.6-native-chromium
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply and validate redesigned shell
        shell: pwsh
        run: ./.github/scripts/ghosium-ui-redesign.ps1
