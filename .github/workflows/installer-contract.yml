name: Ghosium Windows Installer Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ghosium.ico'
      - 'launcher/ghosium.rc'
      - 'installer/**'
      - 'scripts/**'
      - '.github/workflows/windows-build.yml'
      - '.github/workflows/full-source-windows-build.yml'
      - '.github/workflows/installer-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'ghosium.ico'
      - 'launcher/ghosium.rc'
      - 'installer/**'
      - 'scripts/**'
      - '.github/workflows/windows-build.yml'
      - '.github/workflows/full-source-windows-build.yml'
      - '.github/workflows/installer-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-contract:
    name: Verify install and uninstall architecture
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate installer PowerShell scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'scripts/build-native-launcher.ps1',
            'scripts/smoke-test-windows-installer.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parser errors found in $path"
            }
          }

      - name: Verify canonical Ghosium Windows icon
        shell: bash
        run: |
          set -euo pipefail
          test -s ghosium.ico
          signature="$(od -An -tx1 -N4 ghosium.ico | tr -d ' \n')"
          test "$signature" = '00000100'
          grep -Fq '101 ICON "ghosium.ico"' launcher/ghosium.rc
          grep -Fq '!define MUI_ICON "${GHOSIUM_ICON}"' installer/ghosium.nsi
          grep -Fq 'Icon "${GHOSIUM_ICON}"' installer/portable.nsi
          if grep -Fq 'modern-install.ico' installer/ghosium.nsi; then
            echo 'Setup must not use the generic NSIS icon.' >&2
            exit 1
          fi

      - name: Reject standalone uninstall executables
        shell: bash
        run: |
          set -euo pipefail

          if find . -type f \( -iname 'uninstall.exe' -o -iname 'ghosium-uninstall.exe' -o -iname 'ghosium-browser-uninstall.exe' \) -print -quit | grep -q .; then
            echo 'A standalone uninstall executable is forbidden.' >&2
            exit 1
          fi

          # Remove NSIS comment text before checking executable directives. This
          # allows documentation to explain the forbidden architecture without
          # treating words in comments as active installer commands.
          active_nsi="$(sed 's/[[:space:]]*;.*$//' installer/ghosium.nsi)"
          if printf '%s\n' "$active_nsi" | grep -nE 'WriteUninstaller|MUI_UNPAGE_|Section[[:space:]]+"Uninstall"|Uninstall\.exe'; then
            echo 'installer/ghosium.nsi must use the setup executable for uninstall instead of generating a standalone uninstaller.' >&2
            exit 1
          fi
          if printf '%s\n' "$active_nsi" | grep -nEi 'cmd\.exe|powershell(\.exe)?|rmdir[[:space:]]+/'; then
            echo 'Uninstall cleanup must not depend on a shell command string.' >&2
            exit 1
          fi

      - name: Verify same-setup uninstall registration and delete guard
        shell: bash
        run: |
          set -euo pipefail
          installer='installer/ghosium.nsi'

          required=(
            '!define INSTALLED_SETUP "Installer\\Ghosium-Browser-Setup.exe"'
            '!define INSTALL_MARKER "ghosium-install.marker"'
            '!define CLEANUP_SETUP "$TEMP\\Brendigo\\Ghosium Browser Cleanup\\Ghosium-Browser-Setup.exe"'
            '${GetOptions} $R0 "/UNINSTALL" $R1'
            '${GetOptions} $R0 "/CLEANUP" $R1'
            'CopyFiles /SILENT "$EXEPATH" "$INSTDIR\\${INSTALLED_SETUP}"'
            'CopyFiles /SILENT "$EXEPATH" "${CLEANUP_SETUP}"'
            'Exec '\''"${CLEANUP_SETUP}" /CLEANUP'\'''
            'Exec '\''"${CLEANUP_SETUP}" /CLEANUP /S'\'''
            'IfFileExists "$INSTDIR\\${INSTALL_MARKER}" 0 unsafe_install_location'
            'IfFileExists "$INSTDIR\\${INSTALLED_SETUP}" 0 unsafe_install_location'
            'StrCmp $R6 "Ghosium Browser|${GHOSIUM_VERSION}$\\r$\\n" install_location_verified unsafe_install_location'
            'RMDir /r /REBOOTOK "$INSTDIR"'
            'Delete /REBOOTOK "$EXEPATH"'
            '"UninstallString"'
            '${INSTALLED_SETUP}$\\" /UNINSTALL'
            '"QuietUninstallString"'
            '${INSTALLED_SETUP}$\\" /UNINSTALL /S'
          )

          for needle in "${required[@]}"; do
            if ! grep -Fq "$needle" "$installer"; then
              echo "Missing single-setup uninstall invariant: $needle" >&2
              exit 1
            fi
          done

      - name: Verify Windows release performs real installer smoke test
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/windows-build.yml'
          grep -Fq './scripts/build-native-launcher.ps1' "$workflow"
          grep -Fq './scripts/smoke-test-windows-installer.ps1' "$workflow"
          grep -Fq 'Ghosium-Browser-Setup.exe' scripts/smoke-test-windows-installer.ps1
          grep -Fq '/UNINSTALL' scripts/smoke-test-windows-installer.ps1
          grep -Fq 'UninstallString' scripts/smoke-test-windows-installer.ps1

      - name: Verify full-source uninstall contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'setup.exe --uninstall' scripts/verify-engine-build-output.ps1
          grep -Fq 'standaloneExecutable = $false' scripts/verify-engine-build-output.ps1

          if grep -Ei 'copy-item.*uninstall\.exe|upload.*uninstall\.exe|ghosium-(browser-)?uninstall\.exe' .github/workflows/full-source-windows-build.yml; then
            echo 'Full-source workflow must not package a standalone uninstaller.' >&2
            exit 1
          fi
