name: Ghosium Browser One-Shot Baseline Restore

on:
  push:
    branches:
      - fix/ghosium-main-regression

permissions:
  contents: write

jobs:
  restore-baseline:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          ref: fix/ghosium-main-regression
          fetch-depth: 0

      - name: Restore verified Ghosium baseline
        shell: pwsh
        run: ./.github/scripts/restore-ghosium-baseline.ps1
