name: Ghosium Browser Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ghosium-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  verify-web:
    name: Verify Ghosium web services
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate PHP and JSON
        shell: bash
        run: |
          set -euo pipefail
          php -v
          php -m | grep -qi '^curl$'
          php -m | grep -qi '^dom$'
          find search-web store-web -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r 'foreach (glob("search-web/storage/data/*.json") as $file) { json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR); echo "valid $file\n"; }'
          php -r 'foreach (glob("store-web/storage/data/*.json") as $file) { json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR); echo "valid $file\n"; }'

      - name: Verify Ghosium-only product links
        shell: bash
        run: |
          set -euo pipefail
          files=(extension/newtab.html search-provider/manifest.json store-web/index.php search-web/index.php)
          for file in "${files[@]}"; do
            if grep -InEi 'duckduckgo|chromium|support\.google|chrome\.google|google\.com/chrome' "$file"; then
              echo "Third-party browser branding/link found in Ghosium-controlled UI: $file" >&2
              exit 1
            fi
          done

      - name: Smoke test Ghosium Search
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8099 -t search-web >/tmp/ghosium-search.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8099/ | grep -q 'Ghosium Search'
          curl --fail --silent --show-error http://127.0.0.1:8099/health.php | grep -q '"status":"ok"'
          curl --fail --silent --show-error 'http://127.0.0.1:8099/api/search.php?q=Ghosium' | grep -q '"results"'
          curl --fail --silent --show-error 'http://127.0.0.1:8099/api/suggest.php?q=Ghosium' | grep -q 'Ghosium'

      - name: Smoke test Ghosium Store
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8100 -t store-web >/tmp/ghosium-store.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8100/ | grep -q 'Ghosium Store'
          curl --fail --silent --show-error http://127.0.0.1:8100/api/catalog.php | grep -q '"extensions"'

  build-windows:
    name: Build and verify Windows x64
    needs: verify-web
    runs-on: windows-2025
    timeout-minutes: 55
    outputs:
      version: ${{ steps.meta.outputs.version }}
      revision: ${{ steps.meta.outputs.revision }}
      publish: ${{ steps.meta.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate architecture and resolve version
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          $version = (Get-Content 'VERSION' -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'VERSION must be semantic x.y.z'
          }

          $privacyManifest = Get-Content 'extension/manifest.json' -Raw | ConvertFrom-Json
          $searchManifest = Get-Content 'search-provider/manifest.json' -Raw | ConvertFrom-Json
          foreach ($manifest in @($privacyManifest, $searchManifest)) {
            if ($manifest.version -ne $version) {
              throw "Bundled Ghosium component version $($manifest.version) does not match VERSION $version"
            }
            if ($manifest.manifest_version -ne 3) {
              throw 'Bundled Ghosium components must use Manifest V3'
            }
          }

          if ($searchManifest.chrome_settings_overrides.search_provider.search_url -ne 'https://search.ghosium.com/?q={searchTerms}') {
            throw 'Ghosium Search is not configured as the bundled default search endpoint'
          }

          foreach ($forbidden in @('src-tauri', 'src', 'package.json', 'package-lock.json', 'tsconfig.json', 'vite.config.ts')) {
            if (Test-Path $forbidden) {
              throw "Legacy application-runtime path remains: $forbidden"
            }
          }

          $browserSources = @(Get-ChildItem -Path 'launcher' -Recurse -File -Include *.c,*.cc,*.cpp,*.cxx,*.h,*.hpp,*.rs,*.ts,*.tsx,*.js,*.jsx -ErrorAction SilentlyContinue)
          $badSources = @($browserSources | Where-Object { $_.Extension -notin @('.cpp', '.h', '.hpp') })
          if ($badSources.Count -gt 0) {
            throw "Ghosium browser-owned executable code must remain C++ only: $($badSources.FullName -join ', ')"
          }
          if (Get-ChildItem -Path 'extension', 'search-provider' -Recurse -File -Include *.js,*.mjs,*.ts,*.tsx -ErrorAction SilentlyContinue) {
            throw 'Bundled Ghosium browser components must remain script-free'
          }

          foreach ($required in @(
            'launcher/main.cpp',
            'launcher/ghosium.rc',
            'ghosium.ico',
            'scripts/build-native-launcher.ps1',
            'scripts/resolve-nsis.ps1',
            'scripts/smoke-test-windows-installer.ps1',
            'extension/manifest.json',
            'extension/newtab.html',
            'extension/newtab.css',
            'extension/rules.json',
            'extension/ghosium-mark.svg',
            'search-provider/manifest.json',
            'search-web/index.php',
            'store-web/index.php',
            'installer/ghosium.nsi',
            'installer/portable.nsi',
            'LICENSE',
            'PRIVACY.md',
            'SECURITY.md',
            'THIRD_PARTY_NOTICES.md'
          )) {
            if (!(Test-Path $required -PathType Leaf)) {
              throw "Required file missing: $required"
            }
          }

          $icon = [IO.File]::ReadAllBytes((Resolve-Path 'ghosium.ico'))
          if ($icon.Length -lt 4 -or $icon[0] -ne 0 -or $icon[1] -ne 0 -or $icon[2] -ne 1 -or $icon[3] -ne 0) {
            throw 'Canonical ghosium.ico has an invalid ICO signature.'
          }

          $rules = @(Get-Content 'extension/rules.json' -Raw | ConvertFrom-Json)
          if (@($rules | Group-Object id | Where-Object Count -gt 1).Count -gt 0) {
            throw 'Duplicate declarative rule IDs found'
          }

          $newTab = Get-Content 'extension/newtab.html' -Raw
          foreach ($requiredUrl in @(
            'https://search.ghosium.com/',
            'https://store.ghosium.com/',
            'https://ghosium.com/',
            'https://ghosium.com/support',
            'https://ghosium.com/security',
            'https://ghosium.com/legal/terms',
            'https://ghosium.com/legal/privacy-policy',
            'https://ghosium.com/legal/licenses'
          )) {
            if (!$newTab.Contains($requiredUrl)) {
              throw "New tab is missing required Ghosium URL: $requiredUrl"
            }
          }
          if ($newTab -match '(?i)chromium|duckduckgo|support\.google|chrome\.google') {
            throw 'Third-party browser branding remains in the Ghosium new-tab UI'
          }

          $requestedRevision = (Get-Content 'ENGINE_REVISION' -Raw).Trim()
          if ($requestedRevision -eq 'latest') {
            if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
              throw 'Production main builds must pin ENGINE_REVISION to a numeric revision'
            }
            curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors `
              'https://storage.googleapis.com/chromium-browser-snapshots/Win_x64/LAST_CHANGE' `
              --output "$env:RUNNER_TEMP/engine-last-change.txt"
            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to resolve the official upstream engine revision'
            }
            $revision = (Get-Content "$env:RUNNER_TEMP/engine-last-change.txt" -Raw).Trim()
          } else {
            $revision = $requestedRevision
          }
          if ($revision -notmatch '^\d+$') {
            throw "Resolved engine revision is invalid: $revision"
          }

          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          $publish = ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main' -and -not $exists)

          "version=$version" >> $env:GITHUB_OUTPUT
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Ghosium $version; engine revision $revision; publish=$publish"
          exit 0

      - name: Download verified upstream engine
        id: engine
        shell: pwsh
        env:
          ENGINE_REVISION: ${{ steps.meta.outputs.revision }}
          GHOSIUM_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'downloads', 'staging/runtime', 'artifacts', 'internal' | Out-Null

          function Download-VerifiedFile([string]$Url, [string]$Destination) {
            curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors $Url --output $Destination
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $Destination -PathType Leaf)) {
              throw "Download failed: $Url"
            }
          }

          $base = "https://storage.googleapis.com/chromium-browser-snapshots/Win_x64/$env:ENGINE_REVISION"
          $archive = 'downloads/engine-win.zip'
          Download-VerifiedFile "$base/chrome-win.zip" $archive
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Expand-Archive -Path $archive -DestinationPath 'downloads/engine' -Force

          $sourceDirectory = 'downloads/engine/chrome-win'
          if (!(Test-Path "$sourceDirectory/chrome.exe" -PathType Leaf)) {
            throw 'Official upstream engine archive is incomplete'
          }
          Copy-Item "$sourceDirectory/*" 'staging/runtime' -Recurse -Force
          Move-Item 'staging/runtime/chrome.exe' 'staging/runtime/Ghosium-Engine.exe' -Force

          $engineVersion = (Get-Item 'staging/runtime/Ghosium-Engine.exe').VersionInfo.ProductVersion.Trim()
          if (!$engineVersion) {
            throw 'Unable to read upstream engine product version'
          }

          $effectiveUrl = (& curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors --output NUL --write-out '%{url_effective}' "https://crrev.com/$env:ENGINE_REVISION").Trim()
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to resolve upstream source revision'
          }
          $sourceMatch = [regex]::Match($effectiveUrl, '/\+/([0-9a-f]{40})(?:/|$)')
          if (!$sourceMatch.Success) {
            throw 'Unexpected upstream source revision response'
          }
          $sourceRevision = $sourceMatch.Groups[1].Value

          $licenseEncoded = 'downloads/upstream-license.b64'
          Download-VerifiedFile "https://chromium.googlesource.com/chromium/src/+/$sourceRevision/LICENSE?format=TEXT" $licenseEncoded
          try {
            [IO.File]::WriteAllBytes((Join-Path $PWD 'staging/UPSTREAM-LICENSE.txt'), [Convert]::FromBase64String((Get-Content $licenseEncoded -Raw).Trim()))
          } catch {
            throw 'Upstream license response was invalid'
          }

          [ordered]@{
            ghosiumVersion = $env:GHOSIUM_VERSION
            engineSnapshotRevision = $env:ENGINE_REVISION
            engineVersion = $engineVersion
            engineSourceRevision = $sourceRevision
            engineArchiveSha256 = $archiveHash
            repositoryCommit = $env:GITHUB_SHA
            architecture = 'windows-x64'
            searchEndpoint = 'https://search.ghosium.com/'
            storeEndpoint = 'https://store.ghosium.com/'
            automaticLowMemoryThresholdGiB = 8
          } | ConvertTo-Json | Set-Content 'internal/UPSTREAM-BUILD-INFO.json' -Encoding utf8

          "engine_version=$engineVersion" >> $env:GITHUB_OUTPUT
          "source_revision=$sourceRevision" >> $env:GITHUB_OUTPUT
          "archive_sha256=$archiveHash" >> $env:GITHUB_OUTPUT
          Write-Host "Verified upstream engine $engineVersion"

      - name: Assemble Ghosium files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'extension' 'staging/extension' -Recurse -Force
          Copy-Item 'search-provider' 'staging/search-provider' -Recurse -Force
          Copy-Item 'LICENSE', 'PRIVACY.md', 'SECURITY.md', 'THIRD_PARTY_NOTICES.md' 'staging' -Force

      - name: Compile branded hardened C++20 launcher
        shell: pwsh
        env:
          GHOSIUM_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/build-native-launcher.ps1 -Version $env:GHOSIUM_VERSION -OutputPath 'staging/Ghosium-Browser.exe'

      - name: Run Ghosium launcher and engine smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $selfTest = Start-Process -FilePath (Resolve-Path 'staging/Ghosium-Browser.exe') -ArgumentList '--ghosium-self-test' -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) {
            throw "Ghosium launcher self-test failed with code $($selfTest.ExitCode)"
          }

          $profile = Join-Path $env:RUNNER_TEMP 'ghosium-engine-smoke'
          $stdout = Join-Path $env:RUNNER_TEMP 'ghosium-engine-smoke.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'ghosium-engine-smoke.stderr.txt'
          $engineArgs = @(
            '--headless=new',
            '--disable-gpu',
            '--disable-sync',
            '--no-pings',
            '--no-first-run',
            "--user-data-dir=$profile",
            '--dump-dom',
            'data:text/html,<html><body>ghosium-runtime-ok</body></html>'
          )
          $engine = Start-Process -FilePath (Resolve-Path 'staging/runtime/Ghosium-Engine.exe') -ArgumentList $engineArgs -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $smokeOutput = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
          $smokeError = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
          if ($engine.ExitCode -ne 0 -or !$smokeOutput.Contains('ghosium-runtime-ok')) {
            Write-Host $smokeOutput
            Write-Host $smokeError
            throw "Ghosium engine smoke test failed with code $($engine.ExitCode)"
          }
          Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build Setup and Portable EXE
        shell: pwsh
        env:
          GHOSIUM_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $resolverOutput = @(& ./scripts/resolve-nsis.ps1)
          if ($LASTEXITCODE -ne 0 -or $resolverOutput.Count -eq 0) {
            throw 'Verified NSIS resolver failed.'
          }
          $makensisPath = [string]$resolverOutput[-1]
          if (!(Test-Path $makensisPath -PathType Leaf)) {
            throw "Verified makensis.exe path is invalid: $makensisPath"
          }

          $stagePath = (Resolve-Path 'staging').Path
          $artifactPath = (Resolve-Path 'artifacts').Path
          $iconPath = (Resolve-Path 'ghosium.ico').Path

          foreach ($script in @('installer/ghosium.nsi', 'installer/portable.nsi')) {
            & $makensisPath "/DGHOSIUM_VERSION=$env:GHOSIUM_VERSION" "/DGHOSIUM_STAGE=$stagePath" "/DGHOSIUM_ARTIFACTS=$artifactPath" "/DGHOSIUM_ICON=$iconPath" $script
            if ($LASTEXITCODE -ne 0) {
              throw "NSIS build failed for $script"
            }
          }

          $setup = 'artifacts/Ghosium-Browser-Setup.exe'
          $portable = 'artifacts/Ghosium-Browser-Portable.exe'
          foreach ($file in @($setup, $portable)) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Expected release executable missing: $file"
            }
            if ((Get-Item $file).Length -lt 50MB) {
              throw "Release executable is unexpectedly small: $file"
            }
          }

          $setupInfo = (Get-Item $setup).VersionInfo
          if ([string]$setupInfo.ProductName -ne 'Ghosium Browser' -or [string]$setupInfo.CompanyName -ne 'Brendigo') {
            throw "Setup metadata is not Ghosium/Brendigo: '$($setupInfo.ProductName)' / '$($setupInfo.CompanyName)'"
          }
          $portableInfo = (Get-Item $portable).VersionInfo
          if ([string]$portableInfo.ProductName -ne 'Ghosium Browser Portable' -or [string]$portableInfo.CompanyName -ne 'Brendigo') {
            throw "Portable metadata is not Ghosium/Brendigo: '$($portableInfo.ProductName)' / '$($portableInfo.CompanyName)'"
          }

          if (Get-ChildItem 'artifacts', 'staging' -Recurse -File -Filter 'Uninstall.exe' -ErrorAction SilentlyContinue) {
            throw 'A forbidden standalone Uninstall.exe was generated or staged.'
          }

          $hashes = foreach ($file in @($setup, $portable)) {
            $item = Get-Item $file
            [ordered]@{
              name = $item.Name
              sha256 = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              bytes = $item.Length
            }
          }
          $hashes | ConvertTo-Json | Set-Content 'internal/RELEASE-HASHES.json' -Encoding utf8
          Write-Host "Setup: $([math]::Round((Get-Item $setup).Length / 1MB, 2)) MB"
          Write-Host "Portable: $([math]::Round((Get-Item $portable).Length / 1MB, 2)) MB"

      - name: Smoke test real install and same-Setup uninstall
        shell: pwsh
        env:
          GHOSIUM_VERSION: ${{ steps.meta.outputs.version }}
        run: ./scripts/smoke-test-windows-installer.ps1 -SetupPath 'artifacts/Ghosium-Browser-Setup.exe' -Version $env:GHOSIUM_VERSION

      - name: Upload verified public release executables
        uses: actions/upload-artifact@v4
        with:
          name: Ghosium-Browser-Windows-x64
          path: |
            artifacts/Ghosium-Browser-Setup.exe
            artifacts/Ghosium-Browser-Portable.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish stable Ghosium Release
    needs:
      - verify-web
      - build-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-windows.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release executables
        uses: actions/download-artifact@v5
        with:
          name: Ghosium-Browser-Windows-x64
          path: artifacts

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GHOSIUM_VERSION: ${{ needs.build-windows.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$GHOSIUM_VERSION"
          gh release create "$tag" \
            artifacts/Ghosium-Browser-Setup.exe \
            artifacts/Ghosium-Browser-Portable.exe \
            --target "$GITHUB_SHA" \
            --title "Ghosium Browser v$GHOSIUM_VERSION" \
            --notes $'Stable Ghosium Browser release for Windows x64.\n\n- Ghosium-branded New Tab and Search\n- Ghosium Store integration\n- Ghosium icon and Brendigo Windows metadata\n- 30 installer languages with English default and Croatian included\n- same-Setup Windows uninstall support without a standalone uninstall executable\n- privacy-hardened background networking defaults\n- automatic Low Memory mode on systems with 8 GiB RAM or less\n\nRelease assets intentionally contain only Setup.exe and Portable.exe. GitHub provides the matching source-code archives automatically.' \
            --latest \
            --repo "$GITHUB_REPOSITORY"

  publish-package:
    name: Publish GitHub Package
    needs:
      - verify-web
      - build-windows
      - publish-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-windows.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download verified release executables
        uses: actions/download-artifact@v5
        with:
          name: Ghosium-Browser-Windows-x64
          path: package

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned Ghosium bundle
        env:
          GHOSIUM_VERSION: ${{ needs.build-windows.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ghosium-browser"
          docker build \
            --build-arg GHOSIUM_VERSION="$GHOSIUM_VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$GHOSIUM_VERSION" \
            -f packaging/Dockerfile \
            -t "$image:$GHOSIUM_VERSION" \
            -t "$image:latest" \
            .
          docker push "$image:$GHOSIUM_VERSION"
          docker push "$image:latest"
