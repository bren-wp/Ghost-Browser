name: Ghosium Browser Chromium Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify-search-web:
    name: Verify Ghosium Search shared hosting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate PHP and JSON
        shell: bash
        run: |
          set -euo pipefail
          php -v
          php -m | grep -qi '^curl$'
          php -m | grep -qi '^dom$'
          find search-web -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -r 'foreach (glob("search-web/storage/data/*.json") as $file) { json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR); echo "valid $file\n"; }'

      - name: Reject hardcoded third-party search routes
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInEi 'duckduckgo|google\.[^/[:space:]]*/search|bing\.[^/[:space:]]*/search' extension search-provider search-web launcher; then
            echo 'A hardcoded third-party search route was found.' >&2
            exit 1
          fi

      - name: Smoke test Ghosium Search
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8099 -t search-web >/tmp/ghosium-search.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8099/ | grep -q 'Ghosium Search'
          curl --fail --silent --show-error http://127.0.0.1:8099/health.php | grep -q '"status":"ok"'
          curl --fail --silent --show-error 'http://127.0.0.1:8099/api/search.php?q=Ghosium' | grep -q '"results"'
          curl --fail --silent --show-error 'http://127.0.0.1:8099/api/suggest.php?q=Ghosium' | grep -q 'Ghosium'

  build-windows:
    name: Build and verify Windows x64
    needs: verify-search-web
    runs-on: windows-2025
    timeout-minutes: 40
    outputs:
      version: ${{ steps.meta.outputs.version }}
      revision: ${{ steps.meta.outputs.revision }}
      publish: ${{ steps.meta.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate architecture and resolve version
        id: meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = (Get-Content "VERSION" -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must be semantic x.y.z"
          }

          $privacyManifest = Get-Content "extension/manifest.json" -Raw | ConvertFrom-Json
          $searchManifest = Get-Content "search-provider/manifest.json" -Raw | ConvertFrom-Json
          foreach ($manifest in @($privacyManifest, $searchManifest)) {
            if ($manifest.version -ne $version) {
              throw "Bundled extension version $($manifest.version) does not match VERSION $version"
            }
            if ($manifest.manifest_version -ne 3) {
              throw "Bundled components must use Manifest V3"
            }
          }
          $searchUrl = $searchManifest.chrome_settings_overrides.search_provider.search_url
          if ($searchUrl -ne 'https://search.ghosium.com/?q={searchTerms}') {
            throw "Ghosium Search is not configured as the bundled default search endpoint"
          }

          foreach ($forbidden in @("src-tauri", "src", "package.json", "package-lock.json", "tsconfig.json", "vite.config.ts")) {
            if (Test-Path $forbidden) {
              throw "Legacy application-runtime path remains: $forbidden"
            }
          }

          $browserSources = @(Get-ChildItem -Path "launcher" -Recurse -File -Include *.c,*.cc,*.cpp,*.cxx,*.h,*.hpp,*.rs,*.ts,*.tsx,*.js,*.jsx -ErrorAction SilentlyContinue)
          $badSources = @($browserSources | Where-Object { $_.Extension -notin @('.cpp', '.h', '.hpp') })
          if ($badSources.Count -gt 0) {
            throw "Ghosium browser-owned executable code must remain C++ only: $($badSources.FullName -join ', ')"
          }
          if (Get-ChildItem -Path "extension", "search-provider" -Recurse -File -Include *.js,*.mjs,*.ts,*.tsx -ErrorAction SilentlyContinue) {
            throw "Bundled Ghosium browser components must remain script-free"
          }

          foreach ($required in @(
            "launcher/main.cpp",
            "extension/manifest.json",
            "extension/newtab.html",
            "extension/newtab.css",
            "extension/rules.json",
            "extension/ghosium-mark.svg",
            "search-provider/manifest.json",
            "search-web/index.php",
            "search-web/api/search.php",
            "search-web/api/suggest.php",
            "LICENSE",
            "PRIVACY.md",
            "SECURITY.md"
          )) {
            if (!(Test-Path $required -PathType Leaf)) {
              throw "Required file missing: $required"
            }
          }

          $rules = @(Get-Content "extension/rules.json" -Raw | ConvertFrom-Json)
          $duplicateIds = @($rules | Group-Object id | Where-Object Count -gt 1)
          if ($duplicateIds.Count -gt 0) {
            throw "Duplicate declarative rule IDs found"
          }

          $legacy = "gh" + "ost"
          $legacyMatches = @(git grep -I -n -i -- $legacy -- . 2>$null)
          if ($LASTEXITCODE -eq 0) {
            throw "Legacy branding remains in tracked files:`n$($legacyMatches -join "`n")"
          }
          if ($LASTEXITCODE -ne 1) {
            throw "Brand validation failed"
          }

          $newTab = Get-Content "extension/newtab.html" -Raw
          if (!$newTab.Contains("https://search.ghosium.com/")) {
            throw "New tab is not wired to Ghosium Search"
          }

          $requestedRevision = (Get-Content "CHROMIUM_REVISION" -Raw).Trim()
          if ($requestedRevision -eq "latest") {
            if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF -eq "refs/heads/main") {
              throw "Production main builds must pin CHROMIUM_REVISION to a numeric revision"
            }
            curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors `
              "https://storage.googleapis.com/chromium-browser-snapshots/Win_x64/LAST_CHANGE" `
              --output "$env:RUNNER_TEMP/chromium-last-change.txt"
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to resolve the official Chromium LAST_CHANGE value"
            }
            $revision = (Get-Content "$env:RUNNER_TEMP/chromium-last-change.txt" -Raw).Trim()
          } else {
            $revision = $requestedRevision
          }

          if ($revision -notmatch '^\d+$') {
            throw "Resolved Chromium revision is invalid: $revision"
          }

          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $releaseLookupExit = $LASTEXITCODE
          $exists = $releaseLookupExit -eq 0
          $publish = ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF -eq "refs/heads/main" -and -not $exists)

          "version=$version" >> $env:GITHUB_OUTPUT
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Ghosium $version; Chromium snapshot $revision; publish=$publish"
          exit 0

      - name: Download official Chromium runtime
        id: chromium
        shell: pwsh
        env:
          CHROMIUM_REVISION: ${{ steps.meta.outputs.revision }}
          GHOSIUM_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "downloads", "staging/runtime", "artifacts" | Out-Null

          function Download-VerifiedFile([string]$Url, [string]$Destination) {
            curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors $Url --output $Destination
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $Destination -PathType Leaf)) {
              throw "Download failed: $Url"
            }
          }

          $base = "https://storage.googleapis.com/chromium-browser-snapshots/Win_x64/$env:CHROMIUM_REVISION"
          $archive = "downloads/chrome-win.zip"
          Download-VerifiedFile "$base/chrome-win.zip" $archive
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Expand-Archive -Path $archive -DestinationPath "downloads/chromium" -Force

          $sourceDirectory = "downloads/chromium/chrome-win"
          if (!(Test-Path "$sourceDirectory/chrome.exe" -PathType Leaf)) {
            throw "Official Chromium archive did not contain chrome-win/chrome.exe"
          }
          Copy-Item "$sourceDirectory/*" "staging/runtime" -Recurse -Force

          $chromiumVersion = (Get-Item "staging/runtime/chrome.exe").VersionInfo.ProductVersion.Trim()
          if (!$chromiumVersion) {
            throw "Unable to read Chromium product version"
          }

          $crrevUrl = "https://crrev.com/$env:CHROMIUM_REVISION"
          $effectiveUrl = (& curl.exe --fail --silent --show-error --location --retry 5 --retry-all-errors --output NUL --write-out "%{url_effective}" $crrevUrl).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve Chromium source revision through crrev"
          }
          $sourceMatch = [regex]::Match($effectiveUrl, '/\+/([0-9a-f]{40})(?:/|$)')
          if (!$sourceMatch.Success) {
            throw "crrev returned an unexpected Chromium source URL: $effectiveUrl"
          }
          $sourceRevision = $sourceMatch.Groups[1].Value

          $licenseEncoded = "downloads/chromium-license.b64"
          $licenseUrl = "https://chromium.googlesource.com/chromium/src/+/$sourceRevision/LICENSE?format=TEXT"
          Download-VerifiedFile $licenseUrl $licenseEncoded
          $encoded = (Get-Content $licenseEncoded -Raw).Trim()
          try {
            [IO.File]::WriteAllBytes((Join-Path $PWD "staging/CHROMIUM-LICENSE.txt"), [Convert]::FromBase64String($encoded))
          } catch {
            throw "Chromium LICENSE response was not valid Gitiles base64 content: $($_.Exception.Message)"
          }

          $buildInfo = [ordered]@{
            ghosiumVersion = $env:GHOSIUM_VERSION
            chromiumSnapshotRevision = $env:CHROMIUM_REVISION
            chromiumVersion = $chromiumVersion
            chromiumSourceRevision = $sourceRevision
            chromiumArchiveSha256 = $archiveHash
            repositoryCommit = $env:GITHUB_SHA
            architecture = "windows-x64"
            searchEndpoint = "https://search.ghosium.com/"
            automaticLowMemoryThresholdGiB = 8
          }
          $buildInfo | ConvertTo-Json | Set-Content "staging/BUILD-INFO.json" -Encoding utf8
          @(
            "snapshot=$env:CHROMIUM_REVISION",
            "version=$chromiumVersion",
            "source=$sourceRevision",
            "archive_sha256=$archiveHash"
          ) | Set-Content "staging/CHROMIUM-REVISION.txt" -Encoding ascii

          "chromium_version=$chromiumVersion" >> $env:GITHUB_OUTPUT
          "source_revision=$sourceRevision" >> $env:GITHUB_OUTPUT
          "archive_sha256=$archiveHash" >> $env:GITHUB_OUTPUT
          Write-Host "Chromium $chromiumVersion ($sourceRevision)"

      - name: Assemble Ghosium files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item "extension" "staging/extension" -Recurse -Force
          Copy-Item "search-provider" "staging/search-provider" -Recurse -Force
          Copy-Item "LICENSE", "PRIVACY.md", "SECURITY.md", "THIRD_PARTY_NOTICES.md" "staging" -Force

      - name: Compile hardened C++ launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe was not found"
          }
          $vsPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (!$vsPath) {
            throw "Visual Studio C++ toolchain was not found"
          }
          $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          $compile = "call `"$devCmd`" -arch=x64 -host_arch=x64 && cl.exe /nologo /std:c++20 /O2 /W4 /EHsc /DUNICODE /D_UNICODE /GS /sdl /guard:cf /MT launcher\main.cpp /Fe:staging\Ghosium-Browser.exe /link /SUBSYSTEM:WINDOWS /DYNAMICBASE /NXCOMPAT /HIGHENTROPYVA /GUARD:CF /CETCOMPAT user32.lib shell32.lib"
          & cmd.exe /d /s /c $compile
          if ($LASTEXITCODE -ne 0) {
            throw "C++ launcher compilation failed with exit code $LASTEXITCODE"
          }
          if (!(Test-Path "staging/Ghosium-Browser.exe" -PathType Leaf)) {
            throw "Launcher executable was not produced"
          }

      - name: Run launcher and Chromium smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $selfTest = Start-Process -FilePath (Resolve-Path "staging/Ghosium-Browser.exe") -ArgumentList "--ghosium-self-test" -Wait -PassThru
          if ($selfTest.ExitCode -ne 0) {
            throw "Ghosium launcher self-test failed with code $($selfTest.ExitCode)"
          }

          $profile = Join-Path $env:RUNNER_TEMP "ghosium-chromium-smoke"
          $stdout = Join-Path $env:RUNNER_TEMP "ghosium-chromium-smoke.stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "ghosium-chromium-smoke.stderr.txt"
          $chromiumArgs = @(
            "--headless=new",
            "--disable-gpu",
            "--disable-sync",
            "--no-pings",
            "--no-first-run",
            "--user-data-dir=$profile",
            "--dump-dom",
            "data:text/html,<html><body>ghosium-runtime-ok</body></html>"
          )
          $chromium = Start-Process -FilePath (Resolve-Path "staging/runtime/chrome.exe") -ArgumentList $chromiumArgs -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $smokeOutput = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { "" }
          $smokeError = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
          if ($chromium.ExitCode -ne 0 -or !$smokeOutput.Contains("ghosium-runtime-ok")) {
            Write-Host $smokeOutput
            Write-Host $smokeError
            throw "Chromium headless smoke test failed with code $($chromium.ExitCode)"
          }
          Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build portable, setup and shared-hosting bundles
        shell: pwsh
        env:
          GHOSIUM_VERSION: ${{ steps.meta.outputs.version }}
          CHROMIUM_VERSION: ${{ steps.chromium.outputs.chromium_version }}
          CHROMIUM_REVISION: ${{ steps.meta.outputs.revision }}
        run: |
          $ErrorActionPreference = "Stop"

          $portable = "artifacts/Ghosium-Browser-Portable-v$env:GHOSIUM_VERSION.zip"
          $searchBundle = "artifacts/Ghosium-Search-Shared-Hosting-v$env:GHOSIUM_VERSION.zip"
          Compress-Archive -Path "staging/*" -DestinationPath $portable -CompressionLevel Optimal -Force
          Compress-Archive -Path "search-web/*" -DestinationPath $searchBundle -CompressionLevel Optimal -Force

          $makensis = Get-Command makensis.exe -ErrorAction SilentlyContinue
          if (!$makensis) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "NSIS installation failed"
            }
            $candidate = "C:\Program Files (x86)\NSIS\makensis.exe"
            if (!(Test-Path $candidate)) {
              $candidate = "C:\Program Files\NSIS\makensis.exe"
            }
            if (!(Test-Path $candidate)) {
              throw "NSIS installation did not provide makensis.exe"
            }
            $makensisPath = $candidate
          } else {
            $makensisPath = $makensis.Source
          }

          $stagePath = (Resolve-Path "staging").Path
          $artifactPath = (Resolve-Path "artifacts").Path
          & $makensisPath "/DGHOSIUM_VERSION=$env:GHOSIUM_VERSION" "/DGHOSIUM_STAGE=$stagePath" "/DGHOSIUM_ARTIFACTS=$artifactPath" "installer/ghosium.nsi"
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS build failed"
          }

          $setup = "artifacts/Ghosium-Browser-Setup-v$env:GHOSIUM_VERSION.exe"
          if (!(Test-Path $setup -PathType Leaf)) {
            throw "Setup executable was not produced"
          }

          $releaseNotes = @"
          # Ghosium Browser v$env:GHOSIUM_VERSION

          Stable Windows x64 Chromium-native release.

          - Chromium version: $env:CHROMIUM_VERSION
          - Chromium snapshot revision: $env:CHROMIUM_REVISION
          - Native Ghosium launcher: C++20
          - Ghosium Search is the bundled search endpoint for new-tab and omnibox search
          - Script-free Manifest V3 privacy component with declarative tracker and tracking-parameter rules
          - Automatic Low Memory mode on systems with 8 GiB RAM or less; Balanced mode remains available
          - Browser sync, crash reporting, background mode, domain-reliability reporting and hyperlink auditing pings disabled by the Ghosium launcher
          - Includes Chromium tabs, settings, history, downloads, password controls, permissions, extensions and DevTools
          - Includes Ghosium-Search-Shared-Hosting-v$env:GHOSIUM_VERSION.zip for search.ghosium.com (PHP + JSON, no database)
          - This is a normal stable release, not a pre-release.
          "@
          $releaseNotes | Set-Content "artifacts/RELEASE-NOTES.md" -Encoding utf8
          Copy-Item "staging/BUILD-INFO.json", "staging/CHROMIUM-REVISION.txt", "staging/CHROMIUM-LICENSE.txt" "artifacts" -Force

          $files = @($portable, $setup, $searchBundle, "artifacts/BUILD-INFO.json", "artifacts/CHROMIUM-REVISION.txt", "artifacts/CHROMIUM-LICENSE.txt")
          $checksumLines = foreach ($file in $files) {
            $item = Get-Item $file
            $hash = (Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($item.Name)"
          }
          $checksumLines | Set-Content "artifacts/SHA256SUMS.txt" -Encoding ascii

          Write-Host "Portable: $([math]::Round((Get-Item $portable).Length / 1MB, 2)) MB"
          Write-Host "Setup: $([math]::Round((Get-Item $setup).Length / 1MB, 2)) MB"
          Write-Host "Search shared hosting: $([math]::Round((Get-Item $searchBundle).Length / 1KB, 2)) KB"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: Ghosium-Browser-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish stable GitHub Release
    needs:
      - verify-search-web
      - build-windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-windows.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@v5
        with:
          name: Ghosium-Browser-Windows-x64
          path: artifacts

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GHOSIUM_VERSION: ${{ needs.build-windows.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$GHOSIUM_VERSION"
          gh release create "$tag" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Ghosium Browser v$GHOSIUM_VERSION" \
            --notes-file artifacts/RELEASE-NOTES.md \
            --latest \
            --repo "$GITHUB_REPOSITORY"

  publish-package:
    name: Publish GitHub Package
    needs:
      - verify-search-web
      - build-windows
      - publish-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-windows.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download verified release bundle
        uses: actions/download-artifact@v5
        with:
          name: Ghosium-Browser-Windows-x64
          path: package

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned OCI release bundle
        env:
          GHOSIUM_VERSION: ${{ needs.build-windows.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ghosium-browser"
          docker build \
            --build-arg GHOSIUM_VERSION="$GHOSIUM_VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$GHOSIUM_VERSION" \
            -f packaging/Dockerfile \
            -t "$image:$GHOSIUM_VERSION" \
            -t "$image:latest" \
            .
          docker push "$image:$GHOSIUM_VERSION"
          docker push "$image:latest"
