name: Ghost Browser Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Audit frontend dependencies
        run: npm run audit

      - name: Check frontend
        run: npm run build

      - name: Normalize Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Test Rust and 320-tab scheduler
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --lib

      - name: Build Ghost Browser and NSIS installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect portable and setup executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $portable = Join-Path $release "ghost-browser.exe"
          if (!(Test-Path $portable)) {
            throw "Portable executable was not produced at $portable"
          }
          Copy-Item $portable (Join-Path $out "Ghost-Browser-Portable.exe")

          $setup = Get-ChildItem (Join-Path $release "bundle/nsis") -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $setup) {
            throw "NSIS setup executable was not produced"
          }
          Copy-Item $setup.FullName (Join-Path $out "Ghost-Browser-Setup.exe")

          $portableHash = (Get-FileHash (Join-Path $out "Ghost-Browser-Portable.exe") -Algorithm SHA256).Hash.ToLower()
          $setupHash = (Get-FileHash (Join-Path $out "Ghost-Browser-Setup.exe") -Algorithm SHA256).Hash.ToLower()
          @(
            "$portableHash  Ghost-Browser-Portable.exe",
            "$setupHash  Ghost-Browser-Setup.exe"
          ) | Set-Content (Join-Path $out "SHA256SUMS.txt") -Encoding ascii

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-Browser-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v0.4.0"
          $title = "Ghost Browser v0.4.0"
          $notes = "Production Windows build of Ghost Browser v0.4.0 with stricter native tracking prevention, local request filtering, hardened remote WebViews, improved tab restore stability and Memory Saver tuned for up to 320-tab scheduler testing with at most 8 live WebViews. Includes Portable.exe, Setup.exe and SHA256 checksums."

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag artifacts/Ghost-Browser-Portable.exe artifacts/Ghost-Browser-Setup.exe artifacts/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --title $title --notes $notes --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag artifacts/Ghost-Browser-Portable.exe artifacts/Ghost-Browser-Setup.exe artifacts/SHA256SUMS.txt --target $env:GITHUB_SHA --title $title --notes $notes --repo $env:GITHUB_REPOSITORY
          }
