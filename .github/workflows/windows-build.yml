name: Ghost Browser Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2025
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Audit frontend dependencies
        run: npm run audit

      - name: Check production source invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path "src/browser-runtime.ts") {
            throw "Duplicate browser-runtime.ts must not exist"
          }
          if (Select-String -Path "src/*.ts" -Pattern "console\.error|debugger;" -Quiet) {
            throw "Developer-only console/debugger code found in production TypeScript"
          }
          if (Select-String -Path "src-tauri/src/profile.rs" -Pattern "pub\s+(password|secret)\s*:" -Quiet) {
            throw "Plaintext secret field found in Ghost profile storage"
          }
          foreach ($requiredFile in @("src/overlay.ts", "src-tauri/src/suggestions.rs", "src/browser-ui.css")) {
            if (!(Test-Path $requiredFile)) {
              throw "Required production module is missing: $requiredFile"
            }
          }
          $index = Get-Content "index.html" -Raw
          foreach ($required in @("/src/main.ts", "/src/library.ts", "/src/styles.css", "/src/browser-ui.css", "/src/library.css")) {
            if (!$index.Contains($required)) {
              throw "Production index is missing $required"
            }
          }
          $main = Get-Content "src/main.ts" -Raw
          if (!$main.Contains('"omnibox_suggestions"')) {
            throw "Production shell is not wired to the local omnibox suggestion engine"
          }
          if (!$main.Contains('from "./overlay"')) {
            throw "Production shell is not wired to overlay coordination"
          }
          $library = Get-Content "src/library.ts" -Raw
          if (!$library.Contains('from "./overlay"')) {
            throw "Library UI is not wired to overlay coordination"
          }

      - name: Check frontend
        run: npm run build

      - name: Normalize Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Run Rust functional tests and 320-tab scheduler
        run: cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --lib

      - name: Build Ghost Browser and NSIS installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Collect portable and setup executables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $out = "artifacts"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $portable = Join-Path $release "ghost-browser.exe"
          if (!(Test-Path $portable)) {
            throw "Portable executable was not produced at $portable"
          }
          Copy-Item $portable (Join-Path $out "Ghost-Browser-Portable.exe")

          $setup = Get-ChildItem (Join-Path $release "bundle/nsis") -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $setup) {
            throw "NSIS setup executable was not produced"
          }
          Copy-Item $setup.FullName (Join-Path $out "Ghost-Browser-Setup.exe")

          $portableOut = Get-Item (Join-Path $out "Ghost-Browser-Portable.exe")
          $setupOut = Get-Item (Join-Path $out "Ghost-Browser-Setup.exe")
          $maxPortableBytes = 20MB
          $maxSetupBytes = 15MB
          if ($portableOut.Length -gt $maxPortableBytes) {
            throw "Portable executable exceeds the 20 MB Ghost Browser size budget"
          }
          if ($setupOut.Length -gt $maxSetupBytes) {
            throw "Setup executable exceeds the 15 MB Ghost Browser size budget"
          }

          $portableHash = (Get-FileHash $portableOut.FullName -Algorithm SHA256).Hash.ToLower()
          $setupHash = (Get-FileHash $setupOut.FullName -Algorithm SHA256).Hash.ToLower()
          @(
            "$portableHash  Ghost-Browser-Portable.exe",
            "$setupHash  Ghost-Browser-Setup.exe"
          ) | Set-Content (Join-Path $out "SHA256SUMS.txt") -Encoding ascii

          Write-Host "Portable size: $([math]::Round($portableOut.Length / 1MB, 2)) MB"
          Write-Host "Setup size: $([math]::Round($setupOut.Length / 1MB, 2)) MB"

      - name: Smoke test Windows executable startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "artifacts/Ghost-Browser-Portable.exe").Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              throw "Ghost Browser exited during the startup smoke-test window with code $($process.ExitCode)"
            }
            Write-Host "Ghost Browser startup smoke test passed (PID $($process.Id))."
          }
          finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit(5000) | Out-Null
            }
            Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-Browser-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v0.5.0"
          $title = "Ghost Browser v0.5.0"
          $notes = "Production Windows build of Ghost Browser v0.5.0 with hardened browser interactions, a Chromium-based renderer, tested same-tab omnibox resolution, local Chrome-like suggestions from Favorites and History, local Favorites/History/Downloads, a Windows Credential Manager-protected Password Vault, privacy-first direct TLS Ghost Mail, strict tracking prevention, coordinated native overlays, startup smoke testing and Memory Saver with a 320-tab scheduler. Includes Portable.exe, Setup.exe and SHA256 checksums."

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag artifacts/Ghost-Browser-Portable.exe artifacts/Ghost-Browser-Setup.exe artifacts/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --title $title --notes $notes --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag artifacts/Ghost-Browser-Portable.exe artifacts/Ghost-Browser-Setup.exe artifacts/SHA256SUMS.txt --target $env:GITHUB_SHA --title $title --notes $notes --repo $env:GITHUB_REPOSITORY
          }
