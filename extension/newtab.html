<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>Ghosium Browser</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main class="shell">
    <div class="aurora aurora-a" aria-hidden="true"></div>
    <div class="aurora aurora-b" aria-hidden="true"></div>

    <nav class="product-nav" aria-label="Ghosium">
      <a href="https://ghosium.com/">Home</a>
      <a href="https://store.ghosium.com/">Store</a>
      <a href="https://ghosium.com/support">Support</a>
      <a href="https://ghosium.com/security">Security</a>
    </nav>

    <section class="hero" aria-labelledby="title">
      <img class="mark" src="ghosium-mark.svg" alt="" width="82" height="82">
      <p class="eyebrow">GHOSIUM SEARCH</p>
      <h1 id="title">Browse freely.<br><span>Stay private.</span></h1>
      <p class="lead">Fast browsing, private search and Ghosium protections in one clean experience.</p>

      <form class="search" action="https://search.ghosium.com/" method="get" role="search">
        <label class="sr-only" for="q">Ghosium Search</label>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
        <input id="q" name="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search with Ghosium">
      </form>

      <div class="status" aria-label="Ghosium features">
        <span><strong>Ghosium Search</strong> private search</span>
        <span><strong>Ghosium Shield</strong> tracker protection</span>
        <span><strong>Low Memory</strong> optimized for weaker PCs</span>
      </div>
    </section>

    <footer class="legal-nav">
      <a href="https://ghosium.com/legal/terms">Terms</a>
      <a href="https://ghosium.com/legal/privacy-policy">Privacy</a>
      <a href="https://ghosium.com/legal/licenses">Licenses</a>
    </footer>
  </main>
</body>
</html>
