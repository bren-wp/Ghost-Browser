[package]
name = "ghost-browser"
version = "0.5.0"
description = "Ghost Browser - privacy-first Windows browser"
authors = ["Brendigo"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "ghost_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ghost-browser"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["unstable"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
parking_lot = "0.12"
adblock = { version = "0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
imap = "=2.4.1"
native-tls = "=0.2.18"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
